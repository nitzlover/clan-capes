org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ + the configuration cache still don't get along on loom
# projects — see https://github.com/FabricMC/fabric-loom/issues/1349.
# Locked off until that lands.
org.gradle.configuration-cache=false

# Apex server runs Paper 26.1.2 — Mojang's MC switched to year-based
# versioning (26.x = 2026). MC 26.1 is the first unobfuscated drop,
# so loom no longer fetches mappings — see comment in build.gradle.kts.
minecraftVersion=26.1.2
loaderVersion=0.19.2
fabricApiVersion=0.150.0+26.1.2

modVersion=1.0.2
mavenGroup=dev.clancapes
archivesBaseName=clan-capes-fabric
