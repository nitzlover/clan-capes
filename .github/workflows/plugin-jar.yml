name: Build Paper plugin jar

on:
  push:
    branches: [master]
    paths:
      - 'paper-plugin/**'
      - '.github/workflows/plugin-jar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('paper-plugin/**/*.gradle*', 'paper-plugin/gradle/**') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./paper-plugin/gradlew

      - name: Build shadow jar
        working-directory: paper-plugin
        run: ./gradlew --no-daemon shadowJar

      - name: Resolve artifact path
        id: jar
        run: |
          JAR=$(ls paper-plugin/build/libs/*.jar | head -n1)
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$JAR")" >> "$GITHUB_OUTPUT"

      # Workflow run artifact — download from the run summary UI.
      - name: Upload run artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.jar.outputs.name }}
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error

      # Auto-published "latest" prerelease so a stable URL always serves
      # the most recent successful build of master. The release is tagged
      # `latest-master`, replaced on every push.
      - name: Publish "latest-master" release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-master
          name: 'ClanCapes plugin (latest master)'
          prerelease: true
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: ${{ steps.jar.outputs.path }}
