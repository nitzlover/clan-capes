plugins {
    // Auto-resolves toolchains by downloading from foojay's Disco API
    // when no locally-installed JDK matches the requested major version.
    // Without this, build hosts that don't ship a JDK 21 binary fail
    // with "No locally installed toolchains match" — exactly the
    // failure mode we hit on machines with only JDK 25 installed.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'clan-capes-paper'
