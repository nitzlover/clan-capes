plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.3.1'
}

group = 'dev.clancapes'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'placeholderapi'
        url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/'
    }
    maven {
        name = 'jitpack'
        url = 'https://jitpack.io'
    }
}

dependencies {
    // Use API line matching your server (26.1 / 1.21.x)
    compileOnly 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'
    compileOnly 'me.clip:placeholderapi:2.11.6'
    // PowerClans: reflective hook at runtime (no compile-time dep — JitPack may be unavailable)

    implementation 'io.javalin:javalin:6.3.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'org.xerial:sqlite-jdbc:3.47.2.0'
    implementation 'com.zaxxer:HikariCP:6.2.1'
    implementation 'org.slf4j:slf4j-simple:2.0.16'
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

shadowJar {
    archiveClassifier.set('')
    relocate 'io.javalin', 'dev.clancapes.lib.javalin'
    relocate 'org.eclipse.jetty', 'dev.clancapes.lib.jetty'
    relocate 'com.zaxxer.hikari', 'dev.clancapes.lib.hikari'
    // minimize() breaks Java 21+ string concat (invokedynamic) during ASM remap
}

tasks.build.dependsOn shadowJar

tasks.register('verifyJar') {
    dependsOn shadowJar
    doLast {
        def jarFile = tasks.shadowJar.archiveFile.get().asFile
        if (!jarFile.exists() || jarFile.length() < 1_000_000) {
            throw new GradleException("Invalid plugin JAR: ${jarFile} (${jarFile.exists() ? jarFile.length() + ' bytes' : 'missing'}). Expected ~20 MB.")
        }
        def zip = new java.util.zip.ZipFile(jarFile)
        try {
            if (zip.getEntry('plugin.yml') == null) {
                throw new GradleException("plugin.yml missing in ${jarFile.name}")
            }
        } finally {
            zip.close()
        }
        logger.lifecycle("OK: ${jarFile.name} (${jarFile.length()} bytes)")
    }
}

tasks.build.dependsOn 'verifyJar'
