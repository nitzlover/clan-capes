name: ClanCapes
version: '${version}'
main: dev.clancapes.ClanCapesPlugin
api-version: '1.21'
authors: [ClanCapes]
description: Clan custom capes — REST API, PowerClans integration, web panel sync
website: https://github.com/clancapes/clan-capes
softdepend: [PowerClans, PlaceholderAPI]
commands:
  clancape:
    description: Clan cape management
    usage: /clancape [set <url>|remove|reload|setup|link]
    aliases: [clancapes, ccape]
permissions:
  clan.cape:
    description: Manage your clan cape
    default: op
  clan.cape.admin:
    description: Admin cape management for any clan
    default: op
  clan.cape.setup:
    description: Register this server with the panel (one-time-pass setup)
    default: op
