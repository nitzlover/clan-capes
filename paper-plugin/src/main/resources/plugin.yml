name: Crestoria
version: '${version}'
main: dev.crestoria.CrestoriaPlugin
api-version: '26.1'
authors: [Crestoria]
description: Clan management — capes, banners, armor trims, K/D stats — REST-synced with web panel
website: https://github.com/clancapes/clan-capes
softdepend: [PlaceholderAPI]
commands:
  clancape:
    description: Server registration + cape management + event test harness
    usage: /clancape <setup|link|reload|event|debug>
    aliases: [clancapes, ccape]
    permission: clancapes.cape.admin
  clans:
    description: Clan management
    usage: /clan <create|disband|info|list|invite|accept|decline|leave|kick|promote|demote|transfer|color|panel|menu|shield>
    aliases: [clan, cl, myclan]
    permission: clancapes.clan.use
  clanc:
    description: Send a message to your clan only
    usage: /clanc <message>
    aliases: [cc, clanchat]
    permission: clancapes.clan.use
permissions:
  clancapes.cape.admin:
    description: Register server and manage panel API key
    default: op
  clancapes.clan.use:
    description: Use /clan and /clanc commands
    default: true
  clancapes.clan.admin:
    description: Override clan ownership checks (admin moderation)
    default: op
  clancapes.admin:
    description: Receive plugin update nag on join (clickable download URL)
    default: op
