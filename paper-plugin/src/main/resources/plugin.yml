name: ClanCapes
version: '${version}'
main: dev.clancapes.ClanCapesPlugin
api-version: '1.21'
authors: [ClanCapes]
description: Clan custom capes — REST API, PowerClans integration, web panel sync
website: https://github.com/clancapes/clan-capes
softdepend: [PowerClans, PlaceholderAPI]
commands:
  clancape:
    description: Clan cape management
    usage: /clancape [set <url>|remove|reload|setup|link]
    aliases: [clancapes, ccape]
  clans:
    description: Panel-backed clan management
    usage: /clans <create|disband|info|list|invite|accept|decline|leave|kick|promote|demote|transfer|color>
    # `/clan` collides with PowerClans during the Phase 2 transition;
    # we register `clans` as primary so both plugins can coexist. The
    # alias resolves only when PowerClans is unloaded.
    aliases: [clan, cl, myclan]
permissions:
  clan.cape:
    description: Manage your clan cape
    default: op
  clan.cape.admin:
    description: Admin cape management for any clan
    default: op
  clan.cape.setup:
    description: Register this server with the panel (one-time-pass setup)
    default: op
  clancapes.clan.use:
    description: Use the /clans command
    default: true
