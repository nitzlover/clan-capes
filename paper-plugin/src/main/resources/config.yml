# Clan Capes — Paper plugin configuration
#
# After install:
#   1) Set panel.url to your panel base URL (no trailing slash).
#   2) Run `/clancape setup [server-name]` — plugin generates a one-time
#      token. Paste it into /dashboard/servers "Register server" modal.
#   3) Panel returns a long-lived API key (ck_live_…). Run
#      `/clancape link <api-key>` — plugin saves it under panel.api-key.
#   4) Restart not required. `/clancape reload` re-reads config.
#
# Leaving panel.url empty disables all panel sync (offline-only mode).

panel:
  url: ''
  server-name: ''
  api-key: ''
  # Polling intervals in seconds. Defaults keep network load minimal.
  refresh-clans-sec: 300        # 5 min
  refresh-banners-sec: 300
  refresh-trims-sec: 300
  refresh-settings-sec: 600     # 10 min
  refresh-announcements-sec: 300
  refresh-event-config-sec: 300
  heartbeat-sec: 30
  # HTTP timeout per request.
  request-timeout-ms: 5000

leader-panel:
  # TTL of the /clan panel single-use token in seconds.
  token-ttl-sec: 600

messages:
  prefix: '&8[&6ClanCapes&8] &7'
  no-clan: '&cYou are not in a clan.'
  no-permission: '&cNo permission.'
  panel-not-linked: '&cPanel not linked. Run /clancape setup first.'
  panel-link-success: '&aPanel linked successfully.'
  cape-reloaded: '&aPlugin reloaded.'
  invalid-args: '&cUsage: %usage%'
  clan-tag-invalid: '&cClan tag must be 2-6 uppercase letters/digits.'
  clan-name-invalid: '&cClan name must be 1-32 characters.'

logging:
  # Verbose log lines: every HTTP call, every cache refresh, every kill ingest.
  debug: false
