# Clan Capes — Paper plugin configuration
#
# After install:
#   1) Set panel.url to your panel base URL (no trailing slash).
#   2) Run `/clancape setup [server-name]` — plugin generates a one-time
#      token. Paste it into /dashboard/servers "Register server" modal.
#   3) Panel returns a long-lived API key (ck_live_…). Run
#      `/clancape link <api-key>` — plugin saves it under panel.api-key.
#   4) Restart not required. `/clancape reload` re-reads config.
#
# Leaving panel.url empty disables all panel sync (offline-only mode).

panel:
  url: ''
  server-name: ''
  api-key: ''
  # Polling intervals in seconds. Defaults keep network load minimal.
  refresh-clans-sec: 300        # 5 min
  refresh-banners-sec: 300
  refresh-trims-sec: 300
  refresh-settings-sec: 600     # 10 min
  refresh-announcements-sec: 300
  refresh-event-config-sec: 300
  heartbeat-sec: 30
  # HTTP timeout per request.
  request-timeout-ms: 5000

leader-panel:
  # TTL of the /clan panel single-use token in seconds.
  token-ttl-sec: 600

# 1.0.11: auto-update channel. When enabled and the panel advertises
# a `downloadUrl` for a strictly-newer version, the plugin downloads
# the jar straight into Paper's `plugins/update/` directory. Paper
# hot-swaps any jar there at the next clean stop/start, so the operator
# just has to restart — no manual SFTP, no hosting on the MC box.
# Set to false to keep the fully-manual workflow (you'll still see
# the chat nag, with the download URL clickable).
auto-update:
  enabled: true

invites:
  # /clan invite TTL in seconds. Panel clamps to 60..604800 (1 min..7 days).
  # Default 86400 (24h) matches the events.txt design note.
  ttl-seconds: 86400

messages:
  prefix: '&8[&6Crestoria&8] &7'
  no-clan: '&cYou are not in a clan.'
  no-permission: '&cNo permission.'
  panel-not-linked: '&cPanel not linked. Run /clancape setup first.'
  panel-link-success: '&aPanel linked successfully.'
  cape-reloaded: '&aPlugin reloaded.'
  invalid-args: '&cUsage: %usage%'
  clan-tag-invalid: '&cClan tag must be 2-6 uppercase letters/digits.'
  clan-name-invalid: '&cClan name must be 1-32 characters.'

clan-perks:
  # When a clan member cures a zombie villager, mirror the resulting
  # MAJOR_POSITIVE trade-discount gossip onto every member of that
  # clan — so the whole clan gets the cheaper prices at that villager,
  # not just the player who cured it. Vanilla 0..100 gossip cap is
  # respected; an existing member discount is never lowered. Set false
  # for pure vanilla cure behaviour. (1.1.0+)
  shared-cure-discount: true

logging:
  # Verbose log lines: every HTTP call, every cache refresh, every kill ingest,
  # every event scheduler decision. Can be flipped at runtime with
  # /clancape debug on|off (no restart, persists to this file).
  debug: false

# Test harness for operator dry-runs. Leave `test.enabled: false` in production —
# every other knob in this block is ignored when the master switch is off.
# Driven by the /clancape event start|stop|status|reset commands and read by
# the EventScheduler + AirdropEvent + KingOfHillEvent runtimes.
test:
  enabled: false
  # Skip the per-type cooldown gate (intervalMinutes) so back-to-back forced
  # events fire instantly.
  bypass-cooldown: false
  # Skip the minClansOnline / minPlayersPerClanOnline threshold so a solo
  # operator can launch an event.
  bypass-online-threshold: false
  # Collapse every phase duration into the test.*-seconds values below.
  fast-mode: false
  prep-seconds: 15
  active-seconds: 60       # landing (airdrop) / active (koth)
  collect-seconds: 15
  # Zone overrides. 0 = use the panel-side cfg.radiusBlocks / spawnRadius.
  # >0 = override (tiny zones make a one-player walk-through tractable).
  zone-radius-blocks: 0
  zone-spawn-radius-blocks: 0
