# Clan Capes — Paper plugin configuration
storage:
  type: sqlite # sqlite | json
  sqlite-file: plugins/ClanCapes/data.db
  json-file: plugins/ClanCapes/capes.json

api:
  enabled: true
  host: 0.0.0.0
  port: 8080
  # Shared secret for web panel / internal calls (header: X-ClanCapes-Token)
  token: change-me-in-production
  # Public CDN/base URL returned to clients (no trailing slash)
  cdn-base-url: http://127.0.0.1:3001/static/capes
  cors-origins:
    - http://127.0.0.1:3000
    - http://localhost:3000

capes:
  # Local storage for uploaded capes (served via CDN URL above or nginx)
  storage-dir: plugins/ClanCapes/capes
  max-file-size-kb: 256
  allowed-sizes:
    - width: 64
      height: 32
    - width: 128
      height: 64

integrations:
  powerclans: true
  # Optional absolute/relative path to PowerClans data.yml (default: plugins/PowerClans/data.yml)
  powerclans-data-file: ''
  placeholderapi: true

webhook:
  enabled: false
  url: ''
  secret: ''

logging:
  # Verbose logs for REST API hits, PowerClans resolves, cape sync notifications
  debug: false

# Web panel integration (Phase 1+).
#
# 1) Set `panel.url` to the panel's base URL (no trailing slash) BEFORE
#    running /clancape setup.
# 2) Run /clancape setup [server-name] — plugin generates a one-time
#    token, POSTs it to the panel, and prints the plaintext to chat once.
# 3) Paste the token into the panel's "Register server" modal — panel
#    issues a long-lived API key.
# 4) Run /clancape link <ck_live_…> — plugin stores the key under
#    panel.api-key below. Restart not required.
#
# Leaving panel.url empty disables panel sync entirely; the plugin keeps
# working with its local SQLite storage and the embedded REST API only.
panel:
  url: ''
  server-name: ''
  api-key: ''

messages:
  prefix: '&8[&6ClanCapes&8] &7'
  no-clan: '&cYou are not in a clan.'
  cape-set: '&aClan cape updated.'
  cape-removed: '&eClan cape removed.'
  cape-reloaded: '&aCape cache reloaded.'
  invalid-url: '&cInvalid cape URL.'
  no-permission: '&cNo permission.'
