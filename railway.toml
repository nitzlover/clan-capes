# Unified Clan Capes panel (API + Next.js) — deploy from repository root, no Root Directory override.
# Branch: deploy/panel (recommended) or main with this Dockerfile.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["web-panel/**", "deploy/panel/**", "Dockerfile", "railway.toml"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
