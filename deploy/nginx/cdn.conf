server {
    listen 80;
    server_name _;

    location /capes/ {
        alias /usr/share/nginx/html/capes/;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header Access-Control-Allow-Origin "*";
        types { image/png png; }
        default_type image/png;
    }

    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
